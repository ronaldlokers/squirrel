{{define "youchip"}}<a class="chip face" href="/r/everything" aria-label="who you are">{{if .Face}}<img src="/me/face" alt="" width="40" height="40">{{else}}<span>{{.Letter}}</span>{{end}}</a>{{end}}

{{define "buddychip"}}<a class="chip buddy" href="/r/everything" aria-label="talk to Buddy">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5c0 1.4-1.1 2.5-2.5 2.5H11l-4 3.2V17H6.5A2.5 2.5 0 0 1 4 14.5v-8A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5Z"/></svg>
  </a>{{end}}

{{define "boardchip"}}<a class="chip board" href="/" aria-label="back to the board">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.2" y="4.6" width="17.6" height="14.8" rx="1.6"/><path d="M8.2 4.6v14.8M13.2 4.6v14.8M18 8.4h2.8M18 12h2.8"/></svg>
  </a>{{end}}

{{define "bellchip"}}<a class="chip bell{{if .}} full{{end}}" href="/?told=1" aria-label="what Squirrel told you">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 4 1.4 5.4 1.9 6H4.1C4.6 14.4 6 13 6 9Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
  </a>{{end}}

{{define "findchip"}}<form class="find{{if .}} open{{end}}" method="get" action="/">
    <label class="findpress" for="findfield">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    </label>
    <input id="findfield" name="find" value="{{.}}" placeholder="look for something" autocomplete="off" enterkeyhint="search" aria-label="look for something">
  </form>{{end}}
