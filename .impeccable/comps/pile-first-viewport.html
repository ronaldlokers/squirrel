<!--
THESIS: A shoebox of cards, one at a time. Squirrel's own sticker language —
thick outlines, flat saturated fills, soft geometry — turned into a working
tool, refusing both the scrolling list every notes app ships and the hairline
one-bit rendition that made the first pass feel like nobody lived there.

OWN-WORLD: The logo IS the system, and the logo was redrawn: the mascot now
wears a purple cap badged with a white acorn, and carries a notebook whose page
tabs are green, violet, amber and cream. Three things follow, and none of them
are invented here:
  - The header is the cap. It carries the cap's brim, and the brim is the lid
    of the shoebox.
  - The acorn is the product's second mark. It sits on every card's title bar.
  - The four page tabs are the four states: done is green, kept is amber,
    dropped is the muted brown of the headphones, and a chore is the mark's own
    orange, because it is the one action that makes something.
Card stock is the warm cream of the tail, never white — a white surface is not
Squirrel.

TYPE: Recursive, self-hosted, one variable family carrying both halves of the
brief instead of averaging them. His own words are set in CASL 1, the casual
axis, which is brush-drawn and close to handwriting. Every machine part —
buttons, keycaps, dates, states — is set in CASL 0, the precise axis. Warm and
personal where the content is his; a precision tool everywhere it is the
product's.

STORY: He opens it, the squirrel is already there, he reads one thought in his
own words, decides, and the card is stamped and leaves. He stops whenever he
likes.

FIRST VIEWPORT: The mascot and wordmark on the cap. One card slightly above
centre with its stack beneath it, date in the title bar, four chunky actions at
the foot; MAKE A CHORE is the orange one. No count anywhere.

STATES BUILT: the pile, the chore-interval picker (in place on the card, never
a modal), the actioned card holding still with its undo, search across every
state, and the empty pile.

KEYS: letters are actions - d done, k keep, x drop, c make a chore, u undo,
/ search - and movement is space and the arrow keys. The spec's first draft
asked for j/k to move, which collides with k for keep; the collision was found
here and the spec has since been amended to match, rather than the two being
left to disagree.

Note content below is authored sample material, not Ronald's real notes.
-->

  :root {
    /* Straight off the mark. */
    --purple: #6c4da9;
    --purple-deep: #58388a;
    --purple-dark: #3b2560;
    --violet: #5e23b1;   --violet-ink: #56209f;
    --orange: #e66d0d;
    --orange-lit: #ff8a2b;
    --outline: #1c110b;
    --cream: #fed6a7;          /* the tail */
    --card: #fdecd4;           /* card stock: the tail's cream, lightened */
    --card-deep: #f6d5ab;      /* the cards underneath it */
    --paper: #fffbf3;          /* the raised things sat on the stock */
    --paper-deep: #f7e9d4;     /* those things, pressed */
    --brown: #58413d;          /* the headphones */
    --white: #fefefe;

    /* The notebook's page tabs, one per state. Each has a fill for the tab and
       a darker sibling for type, because the tab colours are chosen to be seen
       at a glance and type has to be read. */
    --done: #529414;      --done-ink: #3c6d0e;
    --kept: #ffb300;      --kept-ink: #8a5c00;
    --dropped: #8a6a55;   --dropped-ink: #6a4f3e;
    --chore: var(--orange); --chore-ink: #b0530a;

    --o: 8px;                  /* stack offset */
    --line: 3px;               /* the outline weight of the mark */
    --r: 14px;

    /* His words in the casual axis, the machinery in the linear one. MONO is
       pinned off on both: this is a warm tool, not a terminal. */
    --casual: "MONO" 0, "CASL" 1;
    --precise: "MONO" 0, "CASL" 0;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  /* The brim reaches past both edges of the lid on purpose; nothing about it
     should be scrollable. */
  html, body { overflow-x: clip; }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--paper);
    font: 400 16px/1.55 "Recursive", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-variation-settings: var(--precise);
    display: flex;
    flex-direction: column;
    background-color: var(--purple-deep);
    background-image:
      radial-gradient(120% 90% at 15% -10%, rgba(150, 110, 220, .5) 0%, rgba(59, 37, 96, 0) 62%),
      radial-gradient(circle at 2px 2px, rgba(254, 214, 167, .07) 2px, transparent 0);
    background-size: 100% 100%, 22px 22px;
    background-attachment: fixed;
  }

  /* The browser's own surfaces belong to the design too. */
  ::selection { background: var(--orange); color: var(--white); }
  ::-webkit-scrollbar { width: 14px; }
  ::-webkit-scrollbar-track { background: var(--purple-dark); }
  ::-webkit-scrollbar-thumb {
    background: var(--orange); border: 3px solid var(--purple-dark); border-radius: 8px;
  }
  * { scrollbar-color: var(--orange) var(--purple-dark); scrollbar-width: thin; }
  :focus-visible { outline: var(--line) solid var(--orange-lit); outline-offset: 3px; }
  .card :focus-visible, .rcard :focus-visible { outline-color: var(--violet); }

  /* ---------- the lid: the mascot's cap ---------- */

  .lid {
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 18px;
    padding: 11px 22px 13px;
    background: var(--purple-dark);
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand img {
    width: 84px; height: 63px; display: block;
    filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .3));
  }
  .wordmark {
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 900;
    font-variation-settings: normal;
    font-size: 26px;
    letter-spacing: -.028em;
    color: var(--paper);
    -webkit-text-stroke: 2px var(--outline);
    paint-order: stroke fill;
  }
  .lid .spacer { flex: 1; }

  /* The mascot's cap has a brim, so the lid of the box has one too: the whole
     header edge sags into it, and the outline is the mark's own weight. */
  /* Stretched to the full width rather than curved by a radius, so the outline
     never rises back into the lid and leaves the screen edges bare. The stroke
     stays 3px at any width. */
  .brim {
    /* An svg is a replaced element: left/right will not stretch it, so the
       width has to be stated. */
    position: absolute; left: 0; top: 100%;
    width: 100%; height: 30px; display: block; pointer-events: none;
    /* No cast shadow. It pooled under the deepest part of the curve and read as
       a stain in the middle of the header; the 3px outline is what separates
       this world's shapes, and the mark itself has no gradients. */
  }

  .find {
    flex: 0 1 280px; min-width: 0;
    display: flex; align-items: center; gap: 8px;
    padding: 9px 14px;
    background: var(--paper);
    border: var(--line) solid var(--outline);
    border-radius: 999px;
    box-shadow: 0 3px 0 0 var(--outline);
  }
  .find:focus-within { box-shadow: 0 3px 0 0 var(--outline), 0 0 0 3px var(--orange-lit); }
  .find svg { flex: none; }
  .find input {
    flex: 1; min-width: 4ch; border: 0; background: transparent;
    font: 500 14.5px/1.4 "Recursive", sans-serif;
    font-variation-settings: var(--precise), "wght" 600;
    color: var(--outline); caret-color: var(--orange); padding: 0;
  }
  .find input::placeholder { color: #8a7361; font-variation-settings: var(--precise), "wght" 500; }
  .find input:focus { outline: none; }

  /* ---------- the field ---------- */

  main {
    flex: 1; display: flex; justify-content: center; align-items: center;
    padding: 58px 22px 48px;
  }
  main.scrolling { align-items: flex-start; padding-top: 62px; }

  .shoebox { width: min(720px, 100%); }
  .deck { position: relative; }

  /* The cards underneath: the only thing that says there is more, never how
     much more. Handled, so they do not sit square. */
  .behind {
    position: absolute; inset: 0;
    background: var(--card-deep);
    border: var(--line) solid var(--outline);
    border-radius: var(--r);
  }
  .behind:nth-of-type(1) { transform: translate(var(--o), var(--o)) rotate(1.1deg); }
  .behind:nth-of-type(2) { transform: translate(calc(var(--o) * 1.6), calc(var(--o) * 2.2)) rotate(-1.4deg); }
  .behind:nth-of-type(3) { transform: translate(calc(var(--o) * 2.1), calc(var(--o) * 3.2)) rotate(1.8deg); }

  .card {
    position: relative;
    background: var(--card);
    border: var(--line) solid var(--outline);
    border-radius: var(--r);

  .titlebar {

    { text: "kaas", when: "12 AUGUST" }
  ];

  // Already triaged, so search has something to find across every state.
  const FILED = [
    { text: "meter reading 48213, they ask for it every year and i never have it", state: "kept", when: "9 AUGUST" },
    { text: "boiler service is booked for the 3rd", state: "done", when: "6 AUGUST" },
    { text: "look into that boiler insurance thing everyone keeps on about", state: "dropped", when: "2 AUGUST" },
    // A note promoted to a chore becomes `done` - the spec is explicit, and
    // `items.state` has no `chore` value to hold. CHORE is a stamp, not a state.
    { text: "bins out", state: "done", when: "28 JULY" }
  ];

  const STATES = {
    done:    { word: "DONE",    colour: "var(--done)",    ink: "var(--done-ink)",    said: "marked done" },
    keep:    { word: "KEPT",    colour: "var(--kept)",    ink: "var(--kept-ink)",    said: "kept as reference" },
    kept:    { word: "KEPT",    colour: "var(--kept)",    ink: "var(--kept-ink)",    said: "kept as reference" },
    drop:    { word: "DROPPED", colour: "var(--dropped)", ink: "var(--dropped-ink)", said: "dropped" },
    dropped: { word: "DROPPED", colour: "var(--dropped)", ink: "var(--dropped-ink)", said: "dropped" },
    open:    { word: "IN THE PILE", colour: "var(--violet)", ink: "var(--violet-ink)", said: "back in the pile" },
    // Transient only: the stamp shown at the moment of promotion. A note that
    // became a chore is recorded as `done`.
    chore:   { word: "CHORE",   colour: "var(--chore)",   ink: "var(--chore-ink)",   said: "now a chore" }
  };

  const RECORDED = { done: 1, kept: 1, dropped: 1, open: 1 };

  const $ = id => document.getElementById(id);
  const stage = $("stage"), card = $("card");
  const deckView = $("deckView"), resultsView = $("resultsView"), emptyView = $("emptyView");
  const actions = $("actions"), intervals = $("intervals"), undoRow = $("undoRow");
  const stamp = $("stamp"), stampText = $("stampText"), said = $("said");
  const noteText = $("noteText"), when = $("when"), find = $("find");
  const resultsHead = $("resultsHead"), resultsList = $("resultsList"), more = $("more");

  let pile = NOTES.slice();
  let i = 0;
  let busy = false;
  let lastAction = null;

  // Habituation is the enemy: the stack never sits the same way twice.
  function shuffleStack() {
    document.querySelectorAll(".behind").forEach((el, n) => {
      const dir = n % 2 ? -1 : 1;
      const rot = dir * (0.7 + Math.random() * 1.3);
      const step = 1 + n * 0.8 + Math.random() * 0.5;
      el.style.transform = `translate(calc(var(--o) * ${step.toFixed(2)}), calc(var(--o) * ${(step * 1.1).toFixed(2)})) rotate(${rot.toFixed(2)}deg)`;
    });
  }

  function show() {
    if (!pile.length) { showEmpty(); return; }
    i = ((i % pile.length) + pile.length) % pile.length;
    noteText.textContent = pile[i].text;
    when.textContent = pile[i].when;
    shuffleStack();
  }

  function showEmpty() {
    deckView.hidden = true; resultsView.hidden = true; emptyView.hidden = false;
    stage.classList.remove("scrolling");
  }

  function showDeck() {
    resultsView.hidden = true;
    emptyView.hidden = !pile.length;
    deckView.hidden = !!(!pile.length);
    stage.classList.remove("scrolling");
  }

  function resetTray() {
    actions.hidden = false; intervals.hidden = true; undoRow.hidden = true;
    card.classList.remove("stamped");
  }

  let leaveTimer = null, holdTimer = null;

  /* Finish a pending departure at once. Acting on the next note should not wait
     for the last one to finish leaving - clearing has to stay cheap. */
  function settle() {
    clearTimeout(holdTimer); clearTimeout(leaveTimer);
    holdTimer = leaveTimer = null;
    if (!busy) return;
    const at = pile.indexOf(lastAction.note);
    if (at >= 0) pile.splice(at, 1);
    card.classList.remove("leaving");
    resetTray();
    busy = false;
    show();
  }

  /* Act, then hold. The card stays put with its stamp and its undo, and only
     then leaves. Undo has to live where the thing it undoes still is. */
  function act(kind, detail) {
    if (busy || !pile.length) return;
    busy = true;
    const s = STATES[kind];
    stamp.style.setProperty("--sc", s.colour);
    stamp.style.setProperty("--sct", s.ink);
    stampText.textContent = s.word;
    said.textContent = detail ? s.said + ", " + detail : s.said;
    card.classList.add("stamped");
    actions.hidden = true; intervals.hidden = true; undoRow.hidden = false;

    lastAction = { index: i, note: pile[i] };
    // The undo is the only control on the card now, so it takes the focus the
    // pressed button just lost.
    $("undo").focus({ preventScroll: true });
    holdTimer = setTimeout(() => {
      if (!busy) return;
      card.classList.add("leaving");
      leaveTimer = setTimeout(settle, 460);
    }, 1150);
  }

  function undoLast() {
    if (!lastAction) return;
    clearTimeout(holdTimer); clearTimeout(leaveTimer);
    holdTimer = leaveTimer = null;
    busy = false;
    card.classList.remove("leaving");
    resetTray();
    if (!pile.includes(lastAction.note)) pile.splice(lastAction.index, 0, lastAction.note);
    i = lastAction.index;
    lastAction = null;
    showDeck();
    show();
    const first = actions.querySelector(".btn");
    if (first) first.focus({ preventScroll: true });
  }

  function openIntervals() {
    if (busy || !pile.length) return;
    actions.hidden = true; undoRow.hidden = true; intervals.hidden = false;
    intervals.querySelector(".chip").focus();
  }

  function tap(el) {
    if (!el) return;
    el.classList.add("hit");
    setTimeout(() => el.classList.remove("hit"), 150);
  }

  actions.addEventListener("click", e => {
    const b = e.target.closest(".btn"); if (!b) return;
    tap(b);
    const a = b.dataset.act;
    if (a === "chore") openIntervals(); else act(a);
  });

  intervals.addEventListener("click", e => {
    const c = e.target.closest(".chip"); if (!c) return;
    tap(c);
    if (c.id === "choreBack") { resetTray(); return; }
    act("chore", c.dataset.every);
  });

  $("undo").addEventListener("click", undoLast);

  // ---------- search across every state, on the same screen ----------

  function stateOf(n) { return n.state ? n.state : "open"; }

  function highlight(text, q) {
    const at = text.toLowerCase().indexOf(q);
    if (at < 0) return document.createTextNode(text);
    const frag = document.createDocumentFragment();
    frag.append(text.slice(0, at));
    const m = document.createElement("mark");
    m.textContent = text.slice(at, at + q.length);
    frag.append(m, text.slice(at + q.length));
    return frag;
  }

  function search(q) {
    const query = q.trim().toLowerCase();
    if (!query) { showDeck(); return; }

    const hay = pile.map(n => ({ ...n, state: "open" })).concat(FILED);
    const hits = hay.filter(n => n.text.toLowerCase().includes(query));

    resultsList.textContent = "";
    resultsHead.textContent = "";

    if (!hits.length) {
      const p = document.createElement("p");
      p.className = "noHits";
      p.textContent = "nothing says “" + q.trim() + "”.";
      resultsList.append(p);
      more.hidden = true;
    } else {
      resultsHead.append(document.createTextNode("EVERYTHING THAT SAYS"));
      const b = document.createElement("b"); b.textContent = q.trim();
      resultsHead.append(b);
      const CAP = 6;
      hits.slice(0, CAP).forEach(n => {
        const st = stateOf(n);
        const meta = STATES[RECORDED[st] ? st : "open"];
        const el = document.createElement("article");
        el.className = "rcard";
        el.style.setProperty("--sc", meta.colour);
        el.style.setProperty("--sct", meta.ink);

        const tab = document.createElement("span"); tab.className = "tab";
        const m = document.createElement("div"); m.className = "meta";
        const w = document.createElement("span"); w.textContent = n.when;
        const sep = document.createElement("span"); sep.className = "sep"; sep.textContent = "·";
        const s = document.createElement("span");
        s.className = "state";
        s.textContent = meta.word;
        m.append(w, sep, s);

        const p = document.createElement("p");
        p.append(highlight(n.text, query));

        const acts = document.createElement("div");
        acts.className = "racts";
        const labels = st === "open"
          ? [["DONE", "done"], ["KEEP", "keep"], ["DROP", "drop"], ["MAKE A CHORE", "chore"]]
          : [["BACK IN THE PILE", "open"]];
        labels.forEach(([label, kind]) => {
          const b = document.createElement("button");
          b.className = "rbtn" + (kind === "open" ? " back" : kind === "chore" ? " make" : "");
          b.type = "button";
          b.dataset.act = kind;
          b.dataset.text = n.text;
          b.textContent = label;
          acts.append(b);
        });

        el.append(tab, m, p, acts);
        resultsList.append(el);
      });
      // Only true when the list is actually capped, and never how much more.
      more.hidden = hits.length <= CAP;
    }

    deckView.hidden = true; emptyView.hidden = true; resultsView.hidden = false;
    stage.classList.add("scrolling");
  }

  /* Two views, one pile: a result is actionable where it sits, and the same
     transition twice is a no-op rather than an error. */
  resultsList.addEventListener("click", e => {
    const b = e.target.closest(".rbtn"); if (!b) return;
    const text = b.dataset.text, kind = b.dataset.act;
    const inPile = pile.findIndex(n => n.text === text);
    const filed = FILED.findIndex(n => n.text === text);

    if (kind === "open") {
      if (filed >= 0) { pile.unshift({ text: FILED[filed].text, when: FILED[filed].when }); FILED.splice(filed, 1); }
    } else {
      // Promotion to a chore records the note as done; see STATES.
      const state = kind === "chore" ? "done" : kind === "keep" ? "kept" : kind === "drop" ? "dropped" : "done";
      if (inPile >= 0) { FILED.unshift({ ...pile[inPile], state }); pile.splice(inPile, 1); }
      else if (filed >= 0) { FILED[filed].state = state; }
    }
    search(find.value);
  });

  let searchTimer;
  find.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => search(find.value), 120);
  });

  // ---------- keyboard ----------
  // Letters are actions, always. Movement is space and the arrows, because in a
  // one-card topology j/k has nothing to move between and k is keep.

  const KEYS = { d: "done", k: "keep", x: "drop" };

  addEventListener("keydown", e => {
    if (e.target === find) {
      if (e.key === "Escape") { find.value = ""; showDeck(); find.blur(); }
      return;
    }
    if (e.key === "/") { e.preventDefault(); find.focus(); return; }
    if (deckView.hidden) return;
    // A focused control owns space and enter; that is the platform's contract.
    if ((e.key === " " || e.key === "Enter") && e.target.closest("button")) return;

    if (!intervals.hidden) {
      if (e.key === "Escape") { e.preventDefault(); resetTray(); return; }
      const n = ["1", "2", "3", "4"].indexOf(e.key);
      if (n >= 0) {
        e.preventDefault();
        const c = intervals.querySelectorAll(".chip")[n];
        tap(c); act("chore", c.dataset.every);
      }
      return;
    }

    // Undo stays live past the card's departure, right up until the next action.
    if (e.key === "Escape" || e.key.toLowerCase() === "u") {
      if (lastAction) { e.preventDefault(); undoLast(); }
      return;
    }
    // A key pressed while the last card is still leaving finishes that
    // departure and stops there. It must never act on a note not yet seen.
    if (busy) { e.preventDefault(); settle(); return; }

    const k = e.key.toLowerCase();
    if (KEYS[k]) { e.preventDefault(); const b = actions.querySelector('[data-act="' + KEYS[k] + '"]'); tap(b); act(KEYS[k]); return; }
    if (k === "c") { e.preventDefault(); tap(actions.querySelector('[data-act="chore"]')); openIntervals(); return; }
    if (e.key === " " || e.key === "ArrowDown") { e.preventDefault(); i++; show(); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); i--; show(); }
  });

  // The long placeholder is the honest one, but it truncates on a phone and a
  // clipped word reads as a mistake.
  const setPlaceholder = () => {
    find.placeholder = innerWidth < 620 ? "find anything" : "every note, any state";
  };
  setPlaceholder();
  addEventListener("resize", setPlaceholder);

  show();
</script>
