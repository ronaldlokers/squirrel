<!doctype html><html lang="en" style="--light: 24%"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Rail</title><link rel="stylesheet" href="board.css"><link rel="stylesheet" href="chrome.css">
<link rel="stylesheet" href="phone.css"><link rel="stylesheet" href="phone2.css">
<link rel="stylesheet" href="phone3.css"><link rel="stylesheet" href="polish.css"></head><body><header class="ops phone">
  <a class="chip mood"><img src="mood-good.png" alt="how you are: good" width="34" height="27"></a>
  <span class="ospacer"></span>
  <a class="chip bell full" aria-label="what Squirrel told you"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 4 1.4 5.4 1.9 6H4.1C4.6 14.4 6 13 6 9Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg></a>
  <a class="chip face" aria-label="who you are"><span>R</span></a>
</header>
<main class="rail">
  <div class="railline">
    <div class="tick past"><span class="th">08</span></div>
    <div class="tick now"><span class="th">now</span></div>
    <div class="tick"><span class="th">15</span></div>
    <div class="tick"><span class="th">18</span></div>
    <div class="tick"><span class="th">21</span></div>
  </div>
  <div class="hangs">
    <article class="hang late" style="--at:0">
      <p class="hangwhen">this morning</p>
      <p class="hangwhat">bins out</p>
      <p class="hangwhy">the lorry has been &mdash; late</p>
      <form class="stamps"><button class="stamp did">did it</button><button class="stamp no">later</button></form>
    </article>
    <article class="hang at" style="--at:1">
      <p class="hangwhen">in 23 minutes</p>
      <p class="hangwhat">leave for the dentist</p>
      <p class="hangwhy">14:30 &middot; about 25 minutes away</p>
    </article>
    <article class="hang" style="--at:2">
      <p class="hangwhen">this afternoon</p>
      <p class="hangwhat">water the plants</p>
      <form class="stamps"><button class="stamp did">did it</button><button class="stamp no">later</button></form>
    </article>
    <article class="hang" style="--at:3">
      <p class="hangwhen">after supper</p>
      <p class="hangwhat">wipe the counters</p>
      <p class="hangwhy">when you usually do it</p>
    </article>
    <p class="anytime">whenever you like &mdash; sort the recycling, and 5 things you decided</p>
  </div>
</main><form class="catchbar"><input class="words" placeholder="catch a thought" aria-label="catch a thought"><button class="newmark" aria-label="keep it">+</button></form></body></html>
