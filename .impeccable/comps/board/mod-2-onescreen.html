<!doctype html><html lang="en" style="--light: 24%"><head><meta charset="utf-8"><title>One screen, one button</title>
<link rel="stylesheet" href="board.css"><link rel="stylesheet" href="chrome.css">
<link rel="stylesheet" href="wiz.css"><link rel="stylesheet" href="modal.css">
<link rel="stylesheet" href="polish.css"></head><body class="m2">
<div class="film"><p class="filmsign">One screen, one button</p><div class="frames"><div class="frame w2"><p class="flabel">one screen, and one button</p><div class="scrim"><div class="modal">
  <p class="mtitle">Add something</p>
  <input class="bigin" placeholder="what is it?" value="put the bins out" readonly>
  <div class="kindrow">
    <button class="kind k-note">a thought</button><button class="kind k-task">to do once</button>
    <button class="kind k-chore on">comes back</button><button class="kind k-at">a time</button>
  </div>
  <div class="mwell">
    <label class="mlab">How often?</label>
    <div class="rowfields"><span class="fchip">every day</span><span class="fchip on">every week</span>
      <span class="fchip">2 weeks</span><span class="fchip">a month</span><span class="fchip">on a thursday</span></div>
    <label class="mlab">By what time <span>optional</span></label>
    <div class="rowfields"><span class="fchip ghost">07:00</span><span class="fchip ghost">no particular time</span></div>
  </div>
  <div class="mfoot"><button class="stamp ghost">never mind</button><span class="mspace"></span><button class="stamp go">keep it</button></div>
</div></div></div></div></div></body></html>
