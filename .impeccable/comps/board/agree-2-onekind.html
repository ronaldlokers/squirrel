<!doctype html><html lang="en" style="--light: 24%"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>One hue per kind</title>
<link rel="stylesheet" href="board.css"><link rel="stylesheet" href="chrome.css">
<link rel="stylesheet" href="phone.css"><link rel="stylesheet" href="phone2.css">
<link rel="stylesheet" href="phone3.css"><link rel="stylesheet" href="sleeve.css">
<link rel="stylesheet" href="cross.css"><link rel="stylesheet" href="agree.css">
<link rel="stylesheet" href="polish.css"></head><body class="full tabtime onekind"><header class="ops phone">
  <a class="chip mood"><img src="mood-good.png" alt="good" width="34" height="27"></a><span class="ospacer"></span>
  <a class="chip bell full"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 4 1.4 5.4 1.9 6H4.1C4.6 14.4 6 13 6 9Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg></a>
  <a class="chip face"><span>R</span></a></header>
<main class="crossrail"><ol class="railitems">
  <li class="onrail pulledrow k-chore" style="--step:0"><span class="when now">now</span>
    <article class="out k-chore islate"><span class="holder"></span><div class="outbody">
      <p class="outwhy">the lorry comes this morning</p><p class="outname">bins out</p>
      <p class="lateflag">late — today</p>
      <form class="stamps"><button class="stamp go">did it</button><button class="stamp">later</button></form>
    </div></article></li>
<li class="onrail k-at" style="--step:1"><span class="when"></span>
      <a class="edge k-at"><span>14:30</span>leave for the dentist</a></li><li class="onrail k-chore" style="--step:2"><span class="when"></span>
      <a class="edge k-chore"><span>15:00</span>water the plants</a></li><li class="onrail k-chore" style="--step:3"><span class="when"></span>
      <a class="edge k-chore"><span>17:00</span>sort the recycling</a></li><li class="onrail k-chore" style="--step:4"><span class="when"></span>
      <a class="edge k-chore"><span>21:00</span>wipe the counters</a></li>
</ol>
<div class="offrail"><p class="offsign">whenever you like</p><ul class="offlist">
  <li><a class="edge k-task"><span>5</span>things you decided</a></li>
  <li><a class="edge k-note"><span>3</span>in the notes</a></li>
</ul></div></main><form class="catchbar"><input class="words" placeholder="catch a thought" aria-label="catch a thought"><button class="newmark">+</button></form></body></html>
