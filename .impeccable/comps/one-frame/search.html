<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squirrel</title>
<link rel="stylesheet" href="../../../internal/web/static/pile.css">

<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="../../../internal/web/static/apple-touch-icon.png">
<meta name="theme-color" content="#3b2560">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Squirrel">
  <link rel="stylesheet" href="../one-frame-delta.css">
</head>
<body>
<div class="lid">
  
  
  <a class="brand" href="/">
    <img alt="" src="../../../internal/web/static/logo.png" width="84" height="63">
    <span class="wordmark">Squirrel</span>
  </a>
  
  <span class="spacer"></span>
  
  
  
  
  <a class="lidlink" href="/tasks">the tasks</a>
  
  <a class="lidlink" href="/chores">the chores</a>
  
  
  <form class="find" method="get" action="/pile" role="search">
    <svg width="17" height="17" viewBox="0 0 17 17" aria-hidden="true">
      <circle cx="7" cy="7" r="5" fill="none" stroke="#1c110b" stroke-width="2.6"></circle>
      <path d="M11 11 L15.5 15.5" stroke="#1c110b" stroke-width="2.6" stroke-linecap="round"></path>
    </svg>
    <input type="search" name="q" value="boiler" placeholder="every note, any state" aria-label="Search every note">
  </form>
  <svg class="brim" viewBox="-1 0 102 30" preserveAspectRatio="none" aria-hidden="true">
    <path d="M-1 -2 L-1 5 Q 50 29 101 5 L101 -2 Z" fill="#3b2560"></path>
    <path d="M-1 5 Q 50 29 101 5" fill="none" stroke="#1c110b" stroke-width="3" vector-effect="non-scaling-stroke"></path>
  </svg>
</div>

<p id="say" class="offscreen" role="status" aria-live="polite"></p>
<main id="stage" class="scrolling ">



<section class="results">
  
  

  
  <h1 class="deckhead" aria-live="polite">everything that says <b>boiler</b></h1>
  
  <article class="rcard state-open">
    <span class="tab"></span>
    <div class="meta"><span>14 AUGUST</span><span class="sep">·</span><span class="state">IN THE PILE</span></div>
    <p>the boiler makes a noise when the heating comes on in the morning</p>
    <form class="racts" method="post" action="/pile/act">
      <input type="hidden" name="id" value="9">
      <input type="hidden" name="q" value="boiler">
      
      <button class="rbtn" name="act" value="done">DONE</button>
      <button class="rbtn" name="act" value="keep">KEEP</button>
      <button class="rbtn" name="act" value="drop">DROP</button>
      <details class="everyFallback">
  <summary class="rbtn make">MAKE A CHORE</summary>
  <div class="row intervals">
  <span class="lead">HOW OFTEN?</span>
  <button class="chip" name="every" value="every day" data-act="chore" formaction="/pile/chore">every day <span class="key" aria-hidden="true">1</span></button>
  <button class="chip" name="every" value="every week" data-act="chore" formaction="/pile/chore">every week <span class="key" aria-hidden="true">2</span></button>
  <button class="chip" name="every" value="every 2 weeks" data-act="chore" formaction="/pile/chore">every 2 weeks <span class="key" aria-hidden="true">3</span></button>
  <button class="chip" name="every" value="every month" data-act="chore" formaction="/pile/chore">every month <span class="key" aria-hidden="true">4</span></button>
  
  <button class="chip back" type="button" data-close="chore" hidden="">never mind <span class="key" aria-hidden="true">ESC</span></button>
</div>
</details>
      
    </form>
  </article>
  
  <article class="rcard state-kept">
    <span class="tab"></span>
    <div class="meta"><span>14 AUGUST</span><span class="sep">·</span><span class="state">KEPT</span></div>
    <p>the landlord's number is on the boiler</p>
    <form class="racts" method="post" action="/pile/act">
      <input type="hidden" name="id" value="3">
      <input type="hidden" name="q" value="boiler">
      
      <button class="rbtn back" name="act" value="open">BACK IN THE PILE</button>
      
    </form>
  </article>
  
  
  
</section>

</main>


<a class="askacorn" href="/buddy?from=%2fpile" aria-label="Ask Buddy">
  <img alt="" src="../../../internal/web/static/logo.png" width="46" height="35">
</a>



</body></html>
