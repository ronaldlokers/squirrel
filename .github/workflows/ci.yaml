name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # DESIGN.md follows the code. The reasoning, the override and the failure
  # message all live in the script, which is testable and readable in a way
  # inline YAML is not.
  design:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # The gate before it gates. A blocking check that is itself wrong costs
      # either work or credibility, and this is the cheapest place to find out.
      - name: The gate does what it says
        run: .github/scripts/design-follows-the-code_test.sh

      - name: DESIGN.md follows the code
        env:
          # Through the environment rather than into the command line: a pull
          # request title is somebody's typing, and interpolating it into a
          # shell is how that becomes an instruction.
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: .github/scripts/design-follows-the-code.sh "$BASE" "$HEAD" "$TITLE"

  test:
    runs-on: ubuntu-latest

    # The integration suite fails rather than skips without TEST_DATABASE_URL,
    # so a missing service fails the build instead of producing a green run
    # over nothing.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: squirrel
          POSTGRES_PASSWORD: squirrel
          POSTGRES_DB: squirrel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache: true

      - run: make check
      - run: make test-integration
        env:
          TEST_DATABASE_URL: postgres://squirrel:squirrel@127.0.0.1:5432/squirrel_test

  # pile.js is the one part of this product Go cannot see, and two of the three
  # defects the screen has shipped were in it. This job drives the real script
  # in the browser the runner already has, against the real handlers and a fake
  # store — no database, no dependency, about three seconds.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache: true

      - run: make test-browser

  # This job holds packages: write and pushes to ghcr on tags, which is why
  # every third-party action in this file — here and above — is pinned to a
  # commit SHA rather than a version tag: a tag can move to different code
  # without this file changing, and this is the job with a token worth
  # stealing. The version stays as a trailing comment so a human (or
  # Dependabot/Renovate) can still see what's pinned and bump it on purpose.
  # Don't "tidy" these back to @v3/@v6.
  image:
    runs-on: ubuntu-latest
    needs: [test, browser]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build for this architecture
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: squirrel:ci

      - name: Log in to ghcr
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both architectures are mandatory: staging is amd64 and production is
      # arm64, so a single-arch image would pass in staging and fail on the Pis.
      #
      # No :latest tag. The build is not reproducible — the same commit built
      # twice yields different digests — so :latest would be an unpinned
      # pointer to an image whose digest cannot be tied back to any version.
      # Deployments in the homelab repo pin an explicit tag; nothing reads
      # :latest, so it existed only as a trap.
      - name: Build and push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
